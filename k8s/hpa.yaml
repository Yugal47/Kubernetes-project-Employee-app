apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employee-app-hpa
#  namespace: employee-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employee-app-frontend

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70
