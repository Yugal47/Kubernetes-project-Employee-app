name: kubernetes based employee-app
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@V3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Backend
        run: |
          docker build -t yugal47/employee-app-backend:${{ github.sha }} ./backend
          docker push yugal47/employee-app-backend:{{ github.sha }}
       - name: Update Backend Deployment
        run: |
          kubectl set image deployment/employee-app-backend \
            employee-app-backend=yugal47/employee-app-backend:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/employee-app-backend
      - name: Build Frontend
        run: |
          docker build -t yugal47/employee-app-frontend:${{ github.sha }} ./frontend
          docker push yugal47/employee-app-frontend:${{ github.sha }}
      - name: Build Frontend
        run: |
          docker build -t yugal47/employee-app-frontend:${{ github.sha }} ./frontend
          docker push yugal47/employee-app-frontend:${{ github.sha }}

      - name: Update Frontend
        run: |
          kubectl set image deployment/employee-app-frontend \
          employee-app-frontend=yugal47/employee-app-frontend:${{ github.sha }}
