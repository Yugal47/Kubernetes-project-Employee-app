name: Build and Deploy Employee App

on:
  push:
    branches:
      - main
    paths:
      - 'employee_app/backend/**'
      - 'employee_app/frontend/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        run: |
          docker build \
            -t yugal47/employee-app-backend:${{ github.sha }} \
            ./employee_app/backend

          docker push \
            yugal47/employee-app-backend:${{ github.sha }}

      - name: Update Backend Deployment
        run: |
          kubectl set image deployment/employee-app-backend \
          employee-app-backend=yugal47/employee-app-backend:${{ github.sha }}

      - name: Wait for Backend Rollout
        run: |
        kubectl rollout status deployment/employee-app-backend

      - name: Build and Push Frontend
        run: |
          docker build \
            -t yugal47/employee-app-frontend:${{ github.sha }} \
            ./employee_app/frontend

          docker push \
            yugal47/employee-app-frontend:${{ github.sha }}

      - name: Update Frontend Deployment
        run: |
          kubectl set image deployment/employee-app-frontend \
          employee-app-frontend=yugal47/employee-app-frontend:${{ github.sha }}

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/employee-app-frontend
