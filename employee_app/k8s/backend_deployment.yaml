apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-app-backend
  template:
    metadata:
      labels:
        app: employee-app-backend
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z -w 2 employee-app-mysql-service 3306; do echo waiting for mysql; sleep 2; done;']
      containers:
      - name: employee-app-backend
        image: yugal47/employee-app-backend:v0.0.2

        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: employee-app-config
              key: DB_HOST

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: username

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password

