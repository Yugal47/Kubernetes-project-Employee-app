apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-app-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-app-frontend
  template:
    metadata:
      labels:
        app: employee-app-frontend
    spec:
      containers:
      - name: employee-app-frontend
        image: yugal47/employee-app-frontend:v0.0.3
        imagePullPolicy: Always
        env:
        - name: API_BASE_URL
          value: "http://127.0.0.1:46705"
